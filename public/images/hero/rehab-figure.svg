<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" fill="none" class="hero-rehab-figure-svg">
  <defs>
    <linearGradient id="rehabFigureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDEDEF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#48AAAD" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#168F95" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="jointGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8BDADD" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Translucent Silhouette Body Fill -->
  <path
    d="M 85,14 
       C 94,14 100,21 100,32 
       C 100,41 94,48 88,50 
       C 92,53 98,58 104,64 
       C 112,72 120,72 132,69 
       C 134,73 130,77 122,80 
       C 112,83 104,82 96,76 
       C 94,84 92,98 89,112 
       C 96,124 105,142 116,162 
       C 122,174 121,185 119,202 
       C 117,215 118,224 135,228 
       C 138,231 135,233 125,233 
       C 112,233 108,226 107,216 
       C 106,200 108,188 104,172 
       C 94,152 84,136 78,126 
       C 72,135 62,150 52,166 
       C 44,178 36,192 25,206 
       C 22,210 20,208 22,204 
       C 32,190 40,175 48,162 
       C 58,145 66,130 68,120 
       C 64,106 66,88 70,72 
       C 66,74 58,82 52,94 
       C 48,102 46,108 44,106 
       C 43,103 46,95 50,86 
       C 56,74 65,64 72,56 
       C 75,52 76,46 75,40 
       C 73,32 76,14 85,14 Z"
    fill="url(#rehabFigureGrad)"
  />

  <!-- Anatomical Motion Contour Lines -->
  <!-- Head & Neck -->
  <path d="M 85,14 C 94,14 100,21 100,32 C 100,41 94,48 88,50 C 85,51 82,53 82,58" stroke="#48AAAD" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 77,25 C 75,28 75,34 77,42 C 78,47 79,52 82,56" stroke="#48AAAD" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <!-- Spine / Back Axis -->
  <path d="M 82,56 C 80,72 78,92 74,108 C 72,118 70,126 67,132" stroke="#168F95" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.55" stroke-linecap="round" />

  <!-- Chest & Abdominal Contour -->
  <path d="M 88,50 C 92,56 94,66 93,76 C 92,88 90,102 86,116" stroke="#48AAAD" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />

  <!-- Diagonal Kinetic Energy Band across Torso -->
  <path d="M 76,58 C 84,70 90,85 92,102 C 86,105 80,100 74,86 C 70,76 72,64 76,58 Z" fill="#8BDADD" fill-opacity="0.25" stroke="#48AAAD" stroke-width="1.1" stroke-linecap="round" opacity="0.8" />

  <!-- Leading Arm (Right Arm flexed forward) -->
  <path d="M 88,58 C 96,64 104,70 110,75 C 116,79 122,76 132,71" stroke="#48AAAD" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="110" cy="75" r="2.5" fill="#FFFFFF" stroke="#48AAAD" stroke-width="1.2" />

  <!-- Trailing Arm (Left Arm swinging back) -->
  <path d="M 74,60 C 66,70 58,82 52,92 C 48,100 46,106 44,106" stroke="#48AAAD" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />
  <circle cx="53" cy="91" r="2.2" fill="#FFFFFF" stroke="#48AAAD" stroke-width="1" opacity="0.8" />

  <!-- Hip Joint (Ball & Socket Articulation) -->
  <circle cx="68" cy="126" r="9" fill="url(#jointGlow)" stroke="#48AAAD" stroke-width="1.5" />
  <circle cx="68" cy="126" r="4" fill="#48AAAD" opacity="0.8" />
  <path d="M 62,126 L 74,126 M 68,120 L 68,132" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8" />

  <!-- Leading Leg (Right Leg striding forward) -->
  <path d="M 74,130 C 85,142 96,155 110,168" stroke="#48AAAD" stroke-width="1.6" stroke-linecap="round" />
  <!-- Leading Knee Joint (Patellar Articulation) -->
  <circle cx="110" cy="168" r="7" fill="url(#jointGlow)" stroke="#48AAAD" stroke-width="1.4" />
  <circle cx="110" cy="168" r="3" fill="#48AAAD" opacity="0.75" />
  <!-- Lower Leg / Tibia & Fibula double line -->
  <path d="M 110,175 C 112,188 111,202 110,218" stroke="#48AAAD" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 113,178 C 115,190 114,204 113,218" stroke="#168F95" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" stroke-linecap="round" />
  <!-- Ankle & Foot (Strike phase) -->
  <circle cx="110" cy="218" r="3" fill="#FFFFFF" stroke="#48AAAD" stroke-width="1.2" />
  <path d="M 106,224 C 114,224 122,226 135,228 C 137,230 134,233 126,233 C 112,233 107,228 106,224 Z" fill="#8BDADD" fill-opacity="0.3" stroke="#48AAAD" stroke-width="1.3" stroke-linecap="round" />

  <!-- Trailing Leg (Left Leg in Pushoff) -->
  <path d="M 64,130 C 56,142 48,155 42,168" stroke="#48AAAD" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  <!-- Trailing Knee Joint -->
  <circle cx="42" cy="168" r="5.5" fill="url(#jointGlow)" stroke="#48AAAD" stroke-width="1.2" opacity="0.85" />
  <circle cx="42" cy="168" r="2.5" fill="#48AAAD" opacity="0.6" />
  <!-- Trailing Lower Leg & Foot -->
  <path d="M 40,174 C 34,186 28,198 22,208" stroke="#48AAAD" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />
  <circle cx="22" cy="208" r="2.5" fill="#FFFFFF" stroke="#48AAAD" stroke-width="1" opacity="0.75" />
</svg>